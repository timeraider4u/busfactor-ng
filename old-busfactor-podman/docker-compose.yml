services:
  db:
    image: docker.io/library/mysql:5.7
    container_name: busfactor_db
    hostname: db
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      busfactor_net:
        aliases:
          - db

    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--sql-mode="
      - "--max-allowed-packet=256M"
      # Improve performance for importing commits into MySQL database by caching in RAM
      # instead of forcing a fsync after each commit
      - "--innodb-flush-log-at-trx-commit=2"
      - "--innodb-buffer-pool-size=1G"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloner:
    build: .
    container_name: busfactor_cloner
    userns_mode: "keep-id"
    group_add:
      - "keep-groups"
    env_file:
      - .env
    volumes:
      - workspace:/workspace
    networks:
      - busfactor_net
    command: ["/app/clone_repo.sh"]

  gitana:
    build: .
    container_name: busfactor_gitana
    userns_mode: "keep-id"
    group_add:
      - "keep-groups"
    env_file:
      - .env
    volumes:
      - workspace:/workspace
      - ./output:/shared:z
    networks:
      - busfactor_net
    depends_on:
      db:
        condition: service_healthy
      cloner:
        condition: service_completed_successfully
    command: ["/bin/sh", "-c", "echo '[*] Waiting for git clone to finish...'; while [ ! -f /workspace/repo/.git/HEAD ]; do sleep 2; done; python /app/gitana_extract.py"]

  busfactor:
    build: .
    container_name: busfactor_gui
    userns_mode: "keep-id"
    group_add:
      - "keep-groups"
    working_dir: /opt/busfactor
    env_file:
      - .env
    security_opt:
      - label=disable
    volumes:
      - ./output:/shared:z
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
      - QT_X11_NO_MITSHM=1
    networks:
      - busfactor_net
    depends_on:
      gitana:
        condition: service_completed_successfully
    command: ["python", "/app/run_busfactor.py"]

volumes:
  mysql_data:
  workspace:

networks:
  busfactor_net:
    driver: bridge

